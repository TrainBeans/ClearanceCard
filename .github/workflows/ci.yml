name: CI

on:
  push:
    branches: [ "master" ]     # runs after every merge to master
  pull_request:
    branches: [ "master" ]     # runs on every PR targeting master

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'         # caches ~/.m2 between runs for faster builds

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile & test
        run: ./mvnw clean test --batch-mode --no-transfer-progress

      - name: Publish test report
        if: always()             # upload even when tests fail so failures are visible
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

