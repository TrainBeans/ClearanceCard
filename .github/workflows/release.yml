name: Release Docker Image

on:
  push:
    branches: [ "master" ]   # every merge to master publishes a 'master' + SHA tag
    tags:      [ "v*.*.*" ]  # a semver tag (e.g. v1.0.0) publishes a versioned release

jobs:
  docker:
    name: Build & Push to ghcr.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write    # required to push to GitHub Container Registry

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # branch push  → ghcr.io/<owner>/<repo>:master
            type=ref,event=branch
            # semver tag   → ghcr.io/<owner>/<repo>:1.0.0  and  :1.0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always add a short-SHA tag for traceability
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # reuse cached layers between workflow runs
          cache-from: type=gha
          cache-to:   type=gha,mode=max

