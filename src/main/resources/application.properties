spring.application.name=ClearanceCard

# Persistent H2 database stored on disk so cards survive app restarts.
# Database files are created under ./data (for example: ./data/clearancecard.mv.db).
# H2 console connection URL for local/dev: jdbc:h2:file:./data/clearancecard
# Backup expectation: include the ./data directory in host/container backups.
# Migration note: cards from the previous in-memory database are ephemeral and are not auto-migrated.
spring.datasource.url=jdbc:h2:file:./data/clearancecard;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
spring.h2.console.enabled=true

# Schema is initialized via the H2 INIT RUNSCRIPT above using CREATE TABLE IF NOT EXISTS.
spring.sql.init.mode=never

# compose.yaml is intentionally empty; disable Docker Compose integration so the
# app starts without a Docker socket in CI, containers, and local dev.
spring.docker.compose.enabled=false

# Railroad name used in the clearance card print header
app.railroad.name=Free-moN Operations Railway
