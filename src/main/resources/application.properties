spring.application.name=ClearanceCard

# H2 in-memory database - fixed name so H2 console can connect
spring.datasource.url=jdbc:h2:mem:clearancecard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=true

# Run schema.sql on every startup
spring.sql.init.mode=always

# compose.yaml is intentionally empty; disable Docker Compose integration so the
# app starts without a Docker socket in CI, containers, and local dev.
spring.docker.compose.enabled=false

# Railroad name used in the clearance card print header
app.railroad.name=Free-moN Operations Railway

